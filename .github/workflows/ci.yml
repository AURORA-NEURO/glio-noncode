name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit and static checks / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest ruff==0.15.17 "jsonschema>=4.23,<5"
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Compile
        run: python tools/check_python_syntax.py src tests tools/run_ci_cli_contracts.py
      - name: Semantic correctness lint
        run: python -m ruff check --select E9,F63,F7,F82,B023 src tests tools/run_ci_cli_contracts.py
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  cli-contracts:
    name: CLI contracts / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest "jsonschema>=4.23,<5"
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Validate exact CLI contract inventory
        run: python tools/run_ci_cli_contracts.py --check
      - name: Execute exact CLI contract inventory
        run: python tools/run_ci_cli_contracts.py --execute

  pytest-contracts:
    name: Pytest-specific contracts / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest "jsonschema>=4.23,<5"
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Pytest-specific contract tests
        run: >-
          python -m pytest -q
          tests/test_causal_foundation_frontier.py
          tests/test_causal_foundation_frontier_cli.py
          tests/test_causal_foundation_frontier_contract_mutations.py
          tests/test_causal_foundation_frontier_depth.py
          tests/test_causal_foundation_frontier_operational.py
          tests/test_causal_foundation_frontier_query.py
          tests/test_topology_beta_frontier.py
          tests/test_topology_alpha_frontier.py
          tests/test_topology_alpha_frontier_depth.py
          tests/test_link_graph_alpha_frontier.py
          tests/test_link_graph_alpha_frontier_cli.py
          tests/test_link_graph_foundation_frontier.py
          tests/test_link_graph_foundation_frontier_depth.py
          tests/test_link_graph_foundation_frontier_integration.py
          tests/test_link_graph_beta_frontier.py
          tests/test_link_graph_beta_frontier_depth.py
          tests/test_link_graph_beta_frontier_integration.py
          tests/test_link_graph_beta_frontier_operational_matrix.py
          tests/test_link_graph_beta_frontier_operational_matrix_contracts.py
