name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Contract command
        run: python -m glio_noncode schema --output /tmp/glio-schema.json
      - name: Dossier release focused tests
        run: python -m unittest tests.test_dossier_release -v
      - name: Run history and comparison focused tests
        run: python -m unittest tests.test_run_comparison -v
      - name: Comparison release focused tests
        run: python -m unittest tests.test_comparison_release -v
      - name: Fixture evaluation
        run: python -m glio_noncode evaluate examples/case-small.json --data-root /tmp/glio-data --output /tmp/glio-dossier.json
      - name: Frontier fixture evaluation
        run: python -m glio_noncode evaluate-frontier-fixture examples/frontier-glioma-case.json --output /tmp/glio-frontier-fixture.json
      - name: Frontier data boundary audit
        run: python -m glio_noncode audit-frontier-data examples/frontier-glioma-case.json --output /tmp/glio-frontier-data.json
      - name: Frontier replay integrity
        run: python -m glio_noncode replay-frontier-fixtures examples/frontier-glioma-case.json --required-context-key "GRCh38|diffuse_glioma|adult|malignant_oligodendrocyte_like|tumor_core|pre_treatment" --output /tmp/glio-frontier-replay.json
      - name: Frontier operation contracts
        run: python -m glio_noncode frontier-contracts --output /tmp/glio-frontier-contracts.json
      - name: Frontier scenario matrix
        run: python -m glio_noncode evaluate-frontier-scenarios examples/frontier-glioma-case.json --output /tmp/glio-frontier-scenarios.json
      - name: Frontier quality gate
        run: python -m glio_noncode frontier-quality-gate examples/frontier-glioma-case.json --output /tmp/glio-frontier-quality.json
      - name: Cohort beta frontier fixture
        run: python -m glio_noncode cohort-beta-frontier-fixture --output /tmp/glio-cohort-beta-fixture.json
      - name: Cohort beta frontier evaluation
        run: python -m glio_noncode cohort-beta-frontier-evaluate --output /tmp/glio-cohort-beta-evaluation.json
      - name: Cohort beta frontier quality
        run: python -m glio_noncode cohort-beta-frontier-quality --output /tmp/glio-cohort-beta-quality.json
      - name: Cohort beta frontier replay
        run: python -m glio_noncode cohort-beta-frontier-replay --output /tmp/glio-cohort-beta-replay.json
      - name: Cohort beta frontier report
        run: python -m glio_noncode cohort-beta-frontier-report --format markdown --output /tmp/glio-cohort-beta-report.md
      - name: Cohort beta frontier pipeline
        run: python -m glio_noncode run-cohort-beta-frontier-pipeline --output /tmp/glio-cohort-beta-runtime.json
      - name: Cohort alpha frontier fixture
