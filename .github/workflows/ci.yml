    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Run fixed transport catalog module 668 contract
        run: python -m unittest tests.test_review_packet_fixed_transport_catalog_diff_policy_668 -v

