name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Contract command
        run: python -m glio_noncode schema --output /tmp/glio-schema.json
      - name: Fixture evaluation
        run: python -m glio_noncode evaluate examples/case-small.json --data-root /tmp/glio-data --output /tmp/glio-dossier.json
      - name: Frontier fixture evaluation
        run: python -m glio_noncode evaluate-frontier-fixture examples/frontier-glioma-case.json --output /tmp/glio-frontier-fixture.json
      - name: Frontier data boundary audit
        run: python -m glio_noncode audit-frontier-data examples/frontier-glioma-case.json --output /tmp/glio-frontier-data.json
      - name: Frontier replay integrity
        run: python -m glio_noncode replay-frontier-fixtures examples/frontier-glioma-case.json --required-context-key "GRCh38|diffuse_glioma|adult|malignant_oligodendrocyte_like|tumor_core|pre_treatment" --output /tmp/glio-frontier-replay.json
      - name: Frontier operation contracts
        run: python -m glio_noncode frontier-contracts --output /tmp/glio-frontier-contracts.json
      - name: Frontier scenario matrix
        run: python -m glio_noncode evaluate-frontier-scenarios examples/frontier-glioma-case.json --output /tmp/glio-frontier-scenarios.json
      - name: Frontier quality gate
        run: python -m glio_noncode frontier-quality-gate examples/frontier-glioma-case.json --output /tmp/glio-frontier-quality.json
      - name: Variation data boundary audit
        run: python -m glio_noncode audit-variation-data examples/variation-public-aggregate.json --output /tmp/glio-variation-data.json
      - name: Variation fixture evaluation
        run: python -m glio_noncode evaluate-variation-fixture examples/variation-public-aggregate.json --output /tmp/glio-variation-fixture.json
      - name: Variation replay integrity
        run: python -m glio_noncode replay-variation-fixtures examples/variation-public-aggregate.json --required-context-key "GRCh38|diffuse_glioma|adult|malignant_oligodendrocyte_like|tumor_core|pre_treatment" --output /tmp/glio-variation-replay.json
      - name: Variation quality gate
        run: python -m glio_noncode variation-quality-gate examples/variation-public-aggregate.json --output /tmp/glio-variation-quality.json
      - name: Variation scenario matrix
        run: python -m glio_noncode evaluate-variation-scenarios examples/variation-public-aggregate.json --output /tmp/glio-variation-scenarios.json
      - name: Variation operation contracts
        run: python -m glio_noncode variation-contracts --output /tmp/glio-variation-contracts.json
      - name: Variation evidence bundle
        run: python -m glio_noncode build-variation-bundle examples/variation-public-aggregate.json --output /tmp/glio-variation-bundle.json
      - name: Identity data boundary audit
        run: python -m glio_noncode audit-identity-data examples/identity-public-aggregate.json --output /tmp/glio-identity-data.json
      - name: Identity fixture evaluation
        run: python -m glio_noncode evaluate-identity-fixture examples/identity-public-aggregate.json --output /tmp/glio-identity-fixture.json
      - name: Identity replay integrity
        run: python -m glio_noncode replay-identity-fixtures examples/identity-public-aggregate.json --required-context-key "GRCh38|diffuse_glioma|adult|malignant_oligodendrocyte_like|tumor_core|pre_treatment" --output /tmp/glio-identity-replay.json
      - name: Identity quality gate
        run: python -m glio_noncode identity-quality-gate examples/identity-public-aggregate.json --output /tmp/glio-identity-quality.json
      - name: Identity scenario matrix
        run: python -m glio_noncode evaluate-identity-scenarios examples/identity-public-aggregate.json --output /tmp/glio-identity-scenarios.json
      - name: Identity operation contracts
        run: python -m glio_noncode identity-contracts --output /tmp/glio-identity-contracts.json
      - name: Identity evidence bundle
        run: python -m glio_noncode build-identity-bundle examples/identity-public-aggregate.json --output /tmp/glio-identity-bundle.json
      - name: Intake data boundary audit
        run: python -m glio_noncode audit-intake-data examples/intake-public-aggregate.json --output /tmp/glio-intake-data.json
      - name: Intake fixture evaluation
        run: python -m glio_noncode evaluate-intake-fixture examples/intake-public-aggregate.json --output /tmp/glio-intake-fixture.json
      - name: Intake replay integrity
        run: python -m glio_noncode replay-intake-fixtures examples/intake-public-aggregate.json --required-context-key "GRCh38|diffuse_glioma|adult|malignant_oligodendrocyte_like|tumor_core|pre_treatment" --output /tmp/glio-intake-replay.json
      - name: Intake quality gate
        run: python -m glio_noncode intake-quality-gate examples/intake-public-aggregate.json --output /tmp/glio-intake-quality.json
      - name: Intake scenario matrix
        run: python -m glio_noncode evaluate-intake-scenarios examples/intake-public-aggregate.json --output /tmp/glio-intake-scenarios.json
      - name: Intake operation contracts
        run: python -m glio_noncode intake-contracts --output /tmp/glio-intake-contracts.json
      - name: Intake evidence bundle
        run: python -m glio_noncode build-intake-bundle examples/intake-public-aggregate.json --output /tmp/glio-intake-bundle.json
      - name: Intake pipeline integration
        run: python -m glio_noncode run-intake-pipeline examples/intake-pipeline-accepted.json --output /tmp/glio-intake-pipeline.json
