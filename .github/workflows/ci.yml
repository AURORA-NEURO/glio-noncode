name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit and static checks / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest ruff==0.15.17 "jsonschema>=4.23,<5"
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Compile
        run: python tools/check_python_syntax.py src tests tools/run_ci_cli_contracts.py
      - name: Semantic correctness lint
        run: python -m ruff check --select E9,F63,F7,F82,B023 src tests tools/run_ci_cli_contracts.py
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  cli-contracts:
    name: CLI contracts / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest "jsonschema>=4.23,<5"
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Validate exact CLI contract inventory
        run: python tools/run_ci_cli_contracts.py --check
      - name: Execute exact CLI contract inventory
        run: python tools/run_ci_cli_contracts.py --execute

  workbench-cache:
    name: Restart-aware module workbench cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Build fresh addressed workbench snapshot
        run: >-
          python -m glio_noncode module-workbench-observability
          --cache-root .ci-workbench-cache
          --output .ci-workbench-first.json
      - name: Reopen exact snapshot after process restart
        run: >-
          python -m glio_noncode module-workbench-observability
          --cache-root .ci-workbench-cache
          --output .ci-workbench-restart.json
      - name: Verify cache mode and address conservation
        run: >-
          python -c "import json; first=json.load(open('.ci-workbench-first.json', encoding='utf-8')); restart=json.load(open('.ci-workbench-restart.json', encoding='utf-8')); assert first['rebuild_mode'] in {'full', 'incremental'} and first['cache_hit'] is False; assert restart['rebuild_mode'] == 'snapshot' and restart['cache_hit'] is True; assert restart['reused_module_count'] == restart['module_count']; assert restart['reparsed_module_count'] == 0; assert first['inventory_address'] == restart['inventory_address']; assert first['workbench_address'] == restart['workbench_address']; print('workbench cache contract passed')"
      - name: Build independent baseline and candidate diffs
        run: >-
          python -m glio_noncode module-workbench-diff
          --left-cache-root .ci-workbench-left-cache
          --right-cache-root .ci-workbench-right-cache
          --format json --output .ci-workbench-diff.json
          && python -m glio_noncode module-workbench-execution-diff
          --left-cache-root .ci-workbench-left-cache
          --right-cache-root .ci-workbench-right-cache
          --format json --output .ci-workbench-execution-diff.json
      - name: Verify independent diff conservation
        run: >-
          python -c "import json; module=json.load(open('.ci-workbench-diff.json', encoding='utf-8')); execution=json.load(open('.ci-workbench-execution-diff.json', encoding='utf-8')); assert module['accepted'] and module['added_count'] == 0 and module['removed_count'] == 0 and module['changed_count'] == 0; assert execution['accepted'] and execution['added_count'] == 0 and execution['removed_count'] == 0 and execution['changed_count'] == 0; print(f\"diff cache contract passed: {module['unchanged_count']} modules, {execution['unchanged_count']} execution items\")"
      - name: Build portable module workbench archive
        run: >-
          python -m glio_noncode module-workbench-archive
          --cache-root .ci-workbench-cache
          --destination .ci-workbench.zip
          --format json --output .ci-workbench-archive.json
      - name: Verify and query portable archive without source rebuild
        run: >-
          python -m glio_noncode module-workbench-archive-verify
          .ci-workbench.zip --output .ci-workbench-archive-verification.json
          && python -m glio_noncode module-workbench-archive-query
          .ci-workbench.zip --resource modules --limit 1
          --output .ci-workbench-archive-query.json
          && python -c "import json; verification=json.load(open('.ci-workbench-archive-verification.json', encoding='utf-8')); query=json.load(open('.ci-workbench-archive-query.json', encoding='utf-8')); assert verification['accepted'] and verification['entry_count'] == 2 and not [check for check in verification['checks'] if not check['passed']]; assert query['total'] >= 1 and query['archive_address'] == verification['archive_address']; print('workbench archive contract passed')"
      - name: Compare portable archives without source access
        run: >-
          python -m glio_noncode module-workbench-archive-diff
          --left-archive .ci-workbench.zip
          --right-archive .ci-workbench.zip
          --format json --output .ci-workbench-archive-diff.json
          && python -m glio_noncode module-workbench-archive-diff-verify
          .ci-workbench-archive-diff.json
          --output .ci-workbench-archive-diff-verification.json
          && python -m glio_noncode module-workbench-archive-diff-query
          .ci-workbench-archive-diff.json --kind unchanged --limit 1
          --output .ci-workbench-archive-diff-query.json
          && python -c "import json; verification=json.load(open('.ci-workbench-archive-diff-verification.json', encoding='utf-8')); query=json.load(open('.ci-workbench-archive-diff-query.json', encoding='utf-8')); assert verification['accepted'] and verification['change_count'] >= 1 and not [check for check in verification['checks'] if not check['passed']]; assert query['total'] >= 1 and query['previous_archive_address'] == query['current_archive_address']; print('workbench archive diff contract passed')"
      - name: Evaluate source-free archive diff release policy
        run: >-
          python -m glio_noncode module-workbench-archive-diff-policy
          --diff .ci-workbench-archive-diff.json
          --format json --output .ci-workbench-archive-diff-policy.json
          && python -m glio_noncode module-workbench-archive-diff-policy-verify
          .ci-workbench-archive-diff-policy.json
          --output .ci-workbench-archive-diff-policy-verification.json
          && python -c "import json; gate=json.load(open('.ci-workbench-archive-diff-policy-verification.json', encoding='utf-8')); assert gate['accepted'] and gate['failed_count'] == 0 and not [check for check in gate['checks'] if not check['passed']]; print('workbench archive diff policy contract passed')"
      - name: Build and verify one release-evidence bundle
        run: >-
          python -m glio_noncode module-workbench-release-bundle
          --left-archive .ci-workbench.zip --right-archive .ci-workbench.zip
          --policy-gate .ci-workbench-archive-diff-policy.json
          --destination .ci-workbench-release-bundle.zip
          --format json --output .ci-workbench-release-bundle.json
          && python -m glio_noncode module-workbench-release-bundle-verify
          .ci-workbench-release-bundle.zip
          --output .ci-workbench-release-bundle-verification.json
          && python -m glio_noncode module-workbench-release-bundle-query
          .ci-workbench-release-bundle.zip --resource entries --limit 6
          --output .ci-workbench-release-bundle-query.json
          && python -c "import json; verification=json.load(open('.ci-workbench-release-bundle-verification.json', encoding='utf-8')); query=json.load(open('.ci-workbench-release-bundle-query.json', encoding='utf-8')); assert verification['accepted'] and verification['entry_count'] == 6 and not [check for check in verification['checks'] if not check['passed']]; assert query['total'] == 6; print('workbench release bundle contract passed')"
      - name: Catalog multiple release-evidence bundles without payload duplication
        run: >-
          python -m glio_noncode module-workbench-release-bundle
          --left-archive .ci-workbench.zip --right-archive .ci-workbench.zip
          --policy-gate .ci-workbench-archive-diff-policy.json
          --bundle-id ci-secondary-release-bundle
          --destination .ci-workbench-release-bundle-secondary.zip
          --format json --output .ci-workbench-release-bundle-secondary.json
          && python -m glio_noncode module-workbench-release-bundle-catalog
          --bundle .ci-workbench-release-bundle.zip
          --bundle .ci-workbench-release-bundle-secondary.zip
          --destination .ci-workbench-release-bundle-catalog.json
          && python -m glio_noncode module-workbench-release-bundle-catalog-verify
          .ci-workbench-release-bundle-catalog.json
          --output .ci-workbench-release-bundle-catalog-verification.json
          && python -m glio_noncode module-workbench-release-bundle-catalog-query
          .ci-workbench-release-bundle-catalog.json --state accepted --limit 2
          --output .ci-workbench-release-bundle-catalog-query.json
          && python -c "import json; verification=json.load(open('.ci-workbench-release-bundle-catalog-verification.json', encoding='utf-8')); query=json.load(open('.ci-workbench-release-bundle-catalog-query.json', encoding='utf-8')); assert verification['accepted'] and verification['entry_count'] == 2 and not [check for check in verification['checks'] if not check['passed']]; assert query['total'] == 2; print('workbench release bundle catalog contract passed')"
      - name: Compare release-bundle catalogs without payload access
        run: >-
          python -m glio_noncode module-workbench-release-bundle-catalog
          --bundle .ci-workbench-release-bundle-secondary.zip
          --catalog-id ci-candidate-catalog
          --destination .ci-workbench-release-bundle-catalog-candidate.json
          && python -m glio_noncode module-workbench-release-bundle-catalog-diff
          --left-catalog .ci-workbench-release-bundle-catalog.json
          --right-catalog .ci-workbench-release-bundle-catalog-candidate.json
          --output .ci-workbench-release-bundle-catalog-diff.json
          && python -m glio_noncode module-workbench-release-bundle-catalog-diff-verify
          .ci-workbench-release-bundle-catalog-diff.json
          --output .ci-workbench-release-bundle-catalog-diff-verification.json
          && python -m glio_noncode module-workbench-release-bundle-catalog-diff-query
          .ci-workbench-release-bundle-catalog-diff.json --kind removed --limit 2
          --output .ci-workbench-release-bundle-catalog-diff-query.json
          && python -c "import json; diff=json.load(open('.ci-workbench-release-bundle-catalog-diff.json', encoding='utf-8')); verification=json.load(open('.ci-workbench-release-bundle-catalog-diff-verification.json', encoding='utf-8')); query=json.load(open('.ci-workbench-release-bundle-catalog-diff-query.json', encoding='utf-8')); assert diff['removed_count'] == 1 and diff['unchanged_count'] == 1 and verification['accepted'] and not [check for check in verification['checks'] if not check['passed']]; assert query['total'] == 1; print('workbench release bundle catalog diff contract passed')"
      - name: Evaluate release policy over the catalog diff
        run: >-
          python -m glio_noncode module-workbench-release-bundle-catalog-diff-policy
          --diff .ci-workbench-release-bundle-catalog-diff.json
          --maximum-removed-count 1
          --allowed-direction changed
          --allowed-state-transition changed
          --format json --output .ci-workbench-release-bundle-catalog-diff-policy.json
          && python -m glio_noncode module-workbench-release-bundle-catalog-diff-policy-verify
          .ci-workbench-release-bundle-catalog-diff-policy.json
          --output .ci-workbench-release-bundle-catalog-diff-policy-verification.json
          && python -m glio_noncode module-workbench-release-bundle-catalog-diff-policy-query
          .ci-workbench-release-bundle-catalog-diff-policy.json --failed --limit 2
          --output .ci-workbench-release-bundle-catalog-diff-policy-query.json
          && python -c "import json; gate=json.load(open('.ci-workbench-release-bundle-catalog-diff-policy-verification.json', encoding='utf-8')); query=json.load(open('.ci-workbench-release-bundle-catalog-diff-policy-query.json', encoding='utf-8')); assert gate['accepted'] and gate['failed_count'] == 0 and not [check for check in gate['checks'] if not check['passed']]; assert query['total'] == 0; print('workbench release bundle catalog diff policy contract passed')"
      - name: Upload workbench observations
        uses: actions/upload-artifact@v4
        with:
          name: module-workbench-cache-observations
          path: |
            .ci-workbench-first.json
            .ci-workbench-restart.json
            .ci-workbench-diff.json
            .ci-workbench-execution-diff.json
            .ci-workbench-archive.json
            .ci-workbench-archive-verification.json
            .ci-workbench-archive-query.json
            .ci-workbench-archive-diff.json
            .ci-workbench-archive-diff-verification.json
            .ci-workbench-archive-diff-query.json
            .ci-workbench-archive-diff-policy.json
            .ci-workbench-archive-diff-policy-verification.json
            .ci-workbench-release-bundle.json
            .ci-workbench-release-bundle-verification.json
            .ci-workbench-release-bundle-query.json
            .ci-workbench-release-bundle.zip
            .ci-workbench-release-bundle-secondary.json
            .ci-workbench-release-bundle-secondary.zip
            .ci-workbench-release-bundle-catalog.json
            .ci-workbench-release-bundle-catalog-verification.json
            .ci-workbench-release-bundle-catalog-query.json
            .ci-workbench-release-bundle-catalog-candidate.json
            .ci-workbench-release-bundle-catalog-diff.json
            .ci-workbench-release-bundle-catalog-diff-verification.json
            .ci-workbench-release-bundle-catalog-diff-query.json
            .ci-workbench-release-bundle-catalog-diff-policy.json
            .ci-workbench-release-bundle-catalog-diff-policy-verification.json
            .ci-workbench-release-bundle-catalog-diff-policy-query.json
            .ci-workbench.zip
          if-no-files-found: error

  pytest-contracts:
    name: Pytest-specific contracts / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest "jsonschema>=4.23,<5"
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Pytest-specific contract tests
        run: >-
          python -m pytest -q
          tests/test_causal_foundation_frontier.py
          tests/test_causal_foundation_frontier_cli.py
          tests/test_causal_foundation_frontier_contract_mutations.py
          tests/test_causal_foundation_frontier_depth.py
          tests/test_causal_foundation_frontier_operational.py
          tests/test_causal_foundation_frontier_query.py
          tests/test_topology_beta_frontier.py
          tests/test_topology_alpha_frontier.py
          tests/test_topology_alpha_frontier_depth.py
          tests/test_link_graph_alpha_frontier.py
          tests/test_link_graph_alpha_frontier_cli.py
          tests/test_link_graph_foundation_frontier.py
          tests/test_link_graph_foundation_frontier_depth.py
          tests/test_link_graph_foundation_frontier_integration.py
          tests/test_link_graph_beta_frontier.py
          tests/test_link_graph_beta_frontier_depth.py
          tests/test_link_graph_beta_frontier_integration.py
          tests/test_link_graph_beta_frontier_operational_matrix.py
          tests/test_link_graph_beta_frontier_operational_matrix_contracts.py
