name: Assurance history observatory contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observatory-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile observatory surface
        run: >-
          python -m py_compile
          src/glio_noncode/assurance_history_series_release_registry_federation_gate_review_decision_ledger_assurance_history_observatory.py
          src/glio_noncode/api.py
          src/glio_noncode/cli.py
      - name: Run observatory contract tests
        run: >-
          python -m unittest
          tests.test_assurance_history_series_release_registry_federation_gate_review_decision_ledger_assurance_history_observatory
      - name: Run upstream history and public-boundary tests
        run: >-
          python -m unittest
          tests.test_assurance_history_series_release_registry_federation_gate_review_decision_ledger_assurance_history
          tests.test_public_surface_audit
      - name: Verify CLI capability contract
        run: >-
          python -c "from glio_noncode.cli import main; raise SystemExit(main(['module-workbench-execution-packet-archive-store-replication-packet-diff-release-window-review-store-catalog-packet-review-gate-history-observatory-packet-registry-federation-assurance-gate-review-decision-ledger-assurance-history-observatory-capabilities']))"
